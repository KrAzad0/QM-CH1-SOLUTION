name: Verify Chapter 2 Manuscript

on:
  push:
    branches: [chapter2-solutions-and-website, main]
    paths:
      - "chapter2/**"
      - ".github/workflows/chapter2-check.yml"
  pull_request:
    paths:
      - "chapter2/**"
      - "docs/chapter2/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependencies
        run: python -m pip install numpy scipy matplotlib
      - name: Reproduce numerical checks and diagrams
        run: python chapter2/scripts/numerical_checks.py
      - name: Build Chapter 2 LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: chapter2
          root_file: main.tex
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode
      - name: Check complete PDF exists
        run: test -s chapter2/main.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: QM-CH2-SOLUTION-PDF
          path: |
            chapter2/main.pdf
            chapter2/figures/*.png
          if-no-files-found: error

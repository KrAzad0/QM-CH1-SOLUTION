name: Publish Quantum Mechanics Chapter Websites

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "main.tex"
      - "tex/**"
      - "scripts/**"
      - "chapter2/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quantum-mechanics-pages-publish
  cancel-in-progress: true

jobs:
  publish:
    name: Build both chapter PDFs and publish GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numerical dependencies
        run: python -m pip install numpy scipy matplotlib

      - name: Generate Chapter 1 simulation figure
        run: python scripts/problem_1_13.py

      - name: Generate Chapter 2 checks and figures
        run: python chapter2/scripts/numerical_checks.py

      - name: Compile Chapter 1 PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Compile Chapter 2 PDF
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: chapter2
          root_file: main.tex
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Prepare published HTML and PDF files
        run: |
          test -s main.pdf
          test -s chapter2/main.pdf
          test -s docs/index.html
          test -s docs/chapter2/index.html
          cp main.pdf docs/chapter-1-solutions.pdf
          cp chapter2/main.pdf docs/chapter2/chapter-2-solutions.pdf
          mkdir -p docs/chapter2/figures
          cp chapter2/figures/*.png docs/chapter2/figures/
          touch docs/.nojekyll

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false

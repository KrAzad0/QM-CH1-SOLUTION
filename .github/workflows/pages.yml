name: Publish Chapter 1 Website

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "main.tex"
      - "tex/**"
      - "scripts/problem_1_13.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chapter1-site-publish
  cancel-in-progress: true

jobs:
  publish:
    name: Build manuscript and push GitHub Pages site
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install plot dependencies
        run: python -m pip install numpy matplotlib

      - name: Generate the Problem 1.13 figure
        run: python scripts/problem_1_13.py

      - name: Compile complete solutions PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_use_xelatex: false
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Assemble static site
        run: |
          test -s main.pdf
          cp main.pdf docs/chapter-1-solutions.pdf
          touch docs/.nojekyll
          test -s docs/index.html
          test -s docs/chapter-1-solutions.pdf

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
